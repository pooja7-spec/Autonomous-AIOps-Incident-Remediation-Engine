spring.application.name=incident-analysis-service
server.port=${INCIDENT_ANALYSIS_PORT:8084}
aiops.detection.lookback-minutes=5
aiops.analysis.mode=${AIOPS_ANALYSIS_MODE:demo}
aiops.logging.adapter=${AIOPS_LOGGING_ADAPTER:memory}
logging.service.base-url=${LOGGING_SERVICE_BASE_URL:http://localhost:8083}
logging.service.connect-timeout=${LOGGING_SERVICE_CONNECT_TIMEOUT:2s}
logging.service.read-timeout=${LOGGING_SERVICE_READ_TIMEOUT:3s}
aiops.git.adapter=${AIOPS_GIT_ADAPTER:memory}
aiops.git.executable=${GIT_EXECUTABLE:git}
aiops.git.repository-root=${AIOPS_REPOSITORY_ROOT:.}
aiops.git.history-ref=${AIOPS_GIT_HISTORY_REF:main}
aiops.git.lookback-hours=${AIOPS_GIT_LOOKBACK_HOURS:24}
aiops.git.command-timeout-seconds=10
aiops.git.services[ServiceA].allowed-paths[0]=service-a
aiops.llm.provider=${AIOPS_LLM_PROVIDER:groq}
aiops.llm.api-key=${AIOPS_LLM_API_KEY:${GROQ_API_KEY:}}
aiops.llm.model=${AIOPS_LLM_MODEL:${GROQ_MODEL:openai/gpt-oss-120b}}
aiops.llm.base-url=${AIOPS_LLM_BASE_URL:${GROQ_BASE_URL:https://api.groq.com/openai/v1}}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aiops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:aiops}
spring.datasource.password=${MYSQL_PASSWORD:aiops_dev_password}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.error.include-message=always
