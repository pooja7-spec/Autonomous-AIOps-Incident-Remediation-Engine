spring.application.name=logging-service
server.port=${LOGGING_SERVICE_PORT:8083}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:logging-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=io.github.aiops.contracts.event.LogEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=io.github.aiops.contracts.event
spring.kafka.consumer.properties.spring.json.use.type.headers=false
app.kafka.log-topic=${KAFKA_LOG_TOPIC:log-events}
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/aiops?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
